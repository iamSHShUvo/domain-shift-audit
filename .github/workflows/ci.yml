name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and start Docker Compose services
        run: docker compose up --build -d
      - name: Wait for the web container to become healthy
        run: |
          for attempt in $(seq 1 90); do
            health="$(docker compose ps --format '{{.Health}}' web)"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "The web container did not become healthy within 90 seconds."
          docker compose ps
          exit 1
      - name: Check health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down
