services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - audit-data:/data
    environment:
      DB_PATH: /data/audits.db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  audit-data:
